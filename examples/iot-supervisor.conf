# Supervisor configuration for IoT devices
# Limits each process to minimal resources

[program:ostrace_device1_critical]
command=/usr/local/bin/ostrace-perf-pymobile --pymobile-tunnel 49151 --udid 00008112-000869810A83A01E --filter-config /etc/ostrace/critical.yaml --workers 1 --buffer 50
priority=1
autostart=true
autorestart=true
stdout_logfile=/var/log/ostrace/device1_critical.log
stderr_logfile=/var/log/ostrace/device1_critical_err.log
# Limit CPU to 15% per process
environment=GOMAXPROCS="1"

[program:ostrace_device1_springboard]
command=/usr/local/bin/ostrace-perf-pymobile --pymobile-tunnel 49151 --udid 00008112-000869810A83A01E --filter-config /etc/ostrace/springboard.yaml --workers 1 --buffer 50
priority=2
autostart=true
autorestart=true
stdout_logfile=/var/log/ostrace/device1_springboard.log
stderr_logfile=/var/log/ostrace/device1_springboard_err.log
environment=GOMAXPROCS="1"

# ... repeat for other streams ...

[group:ostrace]
programs=ostrace_device1_critical,ostrace_device1_springboard
priority=999
